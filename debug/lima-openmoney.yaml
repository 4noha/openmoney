# Lima VM 設定 — OpenMoney Linux デバッグ用
# 使用: limactl start --name openmoney debug/lima-openmoney.yaml
#
# 起動後:
#   limactl shell openmoney -- bash /path/to/openmoney/debug/start-display.sh
#   → http://localhost:6080/vnc.html でデスクトップが見える

vmType: vz          # Apple Virtualization.framework (macOS 13+ / 高速)
os: Linux
arch: aarch64       # Apple Silicon (arm64)

images:
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: aarch64

cpus: 2
memory: "3GiB"
disk: "15GiB"

# プロジェクトをそのままマウント (書き込み可)
mounts:
  - location: "~"
    writable: false
  - location: "OPENMONEY_ROOT_PLACEHOLDER"
    writable: true

portForwards:
  # noVNC — Mac ブラウザから Linux デスクトップを表示
  - guestPort: 6080
    hostPort: 6080
    proto: tcp
  # FastAPI サーバー — Mac からも直接 API アクセス可
  - guestPort: 8765
    hostPort: 58765
    proto: tcp

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -e
      export DEBIAN_FRONTEND=noninteractive
      apt-get update -q
      apt-get install -y -q \
        python3-gi python3-gi-cairo \
        gir1.2-gtk-3.0 gir1.2-webkit2-4.1 \
        xvfb x11vnc novnc websockify \
        xterm openbox \
        curl ca-certificates git
      # uv をシステムに入れる
      curl -LsSf https://astral.sh/uv/install.sh | env HOME=/root bash
      ln -sf /root/.local/bin/uv /usr/local/bin/uv || true

message: |
  ✓ OpenMoney Linux デバッグ VM が起動しました。

  次のステップ:
    limactl shell openmoney

  VM 内で以下を実行:
    bash OPENMONEY_ROOT_PLACEHOLDER/debug/start-display.sh

  Mac ブラウザで開く:
    http://localhost:6080/vnc.html

  デスクトップ内で実行:
    DISPLAY=:99 uv run python OPENMONEY_ROOT_PLACEHOLDER/desktop.py
