<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ログイン · OpenMoney</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px;
       background: #1a1a2e; color: #fff; min-height: 100vh;
       display: flex; align-items: center; justify-content: center; padding: 20px; }
.card { background: #fff; color: #333; padding: 36px 32px; border-radius: 10px;
        box-shadow: 0 8px 24px rgba(0,0,0,.4); max-width: 420px; width: 100%; }
h1 { font-size: 18px; margin-bottom: 8px; }
.brand { color: #888; font-size: 12px; margin-bottom: 20px; font-weight: normal; }
.hint { font-size: 13px; color: #666; line-height: 1.7; margin-bottom: 20px; }
input[type=password] { font-size: 15px; padding: 10px 14px; border: 1px solid #ccc;
                       border-radius: 6px; width: 100%; }
button { font-size: 14px; padding: 10px 18px; border-radius: 6px; border: none;
         background: #1976d2; color: #fff; cursor: pointer; width: 100%; margin-top: 12px; font-weight: 600; }
button:hover { background: #1565c0; }
button:disabled { opacity: .5; cursor: not-allowed; }
.error { color: #c62828; font-size: 12px; margin-top: 10px; min-height: 16px; }
.setup-required { background: #fff3e0; color: #6d4c0f; padding: 14px 16px;
                  border-radius: 6px; line-height: 1.6; font-size: 12px; }
.setup-required code { background: rgba(0,0,0,.06); padding: 1px 5px; border-radius: 3px; font-size: 11px; }
</style>
</head>
<body>
<div class="card">
  <div style="text-align:center;margin:0 auto 20px;user-select:none;line-height:1">
    <div style="font-size:30px;font-weight:800;letter-spacing:-1px;color:#1a1a2e">Open<span style="color:#1976d2">Money</span></div>
    <div style="font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#aaa;margin-top:6px">personal finance</div>
  </div>
  <h1 style="text-align:center">🔒 ログイン</h1>
  <div id="content"><div class="hint">読み込み中…</div></div>
</div>
<script>
// ?next=<path> から、ロック前にいたページへ戻る (filter は localStorage で復元)。
// セキュリティ上、外部URLや // から始まる scheme-relative URL は拒否する。
function nextUrl() {
  const p = new URLSearchParams(location.search).get('next');
  if (!p) return '/ui';
  // 同一オリジン path のみ許可: '/' で始まり、'//' (scheme-relative) や ':' を含まない
  if (!p.startsWith('/') || p.startsWith('//') || p.startsWith('/\\')) return '/ui';
  return p;
}

async function init() {
  const s = await fetch('/api/security/status').then(r => r.json());
  const root = document.getElementById('content');
  if (s.unlocked) {
    location.href = nextUrl();
    return;
  }
  if (!s.has_email) {
    // .env に *_EMAIL がまだ無い → 先に登録するよう案内
    root.innerHTML = `
      <div class="setup-required">
        <strong>セットアップが必要です。</strong><br>
        プロジェクトルートの <code>.env</code> に少なくとも 1 つの
        <code>AMAZON_EMAIL</code> など <code>*_EMAIL</code> を登録してから
        この画面に戻ってきてください。<br>
        メールアドレスがマスターパスワードの照合キーになります。
      </div>
      <button onclick="location.reload()" style="margin-top:16px">再確認</button>`;
    return;
  }
  // *_EMAIL あり: 暗号化済なら verify / 平文だけなら bootstrap (両方とも同じ
  // パスワードフォームで OK。サーバ側で適切に分岐する)
  const hint = s.has_encrypted_email
    ? 'マスターパスワードを入力してください。'
    : '初回設定: パスワードを入力すると、.env の値がこのパスワードで暗号化されます。';
  root.innerHTML = `
    <div class="hint">${hint}</div>
    <input id="pw" type="password" placeholder="パスワード" autofocus>
    <button id="login-btn" onclick="login()">${s.has_encrypted_email ? '解錠' : '暗号化して解錠'}</button>
    <div id="error" class="error"></div>`;
  document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
}

async function login() {
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('error');
  const pw = document.getElementById('pw').value;
  if (!pw) return;
  btn.disabled = true;
  err.textContent = '';
  const r = await fetch('/api/security/unlock', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({password: pw}),
  });
  if (r.ok) {
    location.href = nextUrl();
    return;
  }
  const j = await r.json().catch(() => ({}));
  err.textContent = '認証失敗: ' + (j.detail || r.status);
  btn.disabled = false;
}

init();
</script>
</body>
</html>
