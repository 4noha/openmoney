[project]
name = "money-forward2"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.97.0",
    "boto3>=1.43.2",
    "botocore[crt]>=1.43.2",
    "fastapi>=0.115",
    "firebase-admin>=7.4.0",
    "google-auth>=2.34",
    "httpx>=0.27",
    "keyring>=25.7.0",
    "markitdown[pdf]>=0.1.0",
    "playwright>=1.40",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.27",
    "pywebview>=4.3",
    "requests>=2.33.1",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "real_data: tests that read tests/_local/snapshot.db (opt-in, --use-real-db)",
]
